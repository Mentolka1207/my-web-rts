<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14233c"/>
      <stop offset="100%" stop-color="#090c16"/>
    </radialGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ab3ff"/>
      <stop offset="100%" stop-color="#1f588e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#00ffcc" stroke-opacity="0.35" stroke-width="6"/>
  <g transform="translate(256,256)">
    <!-- Quadrotor arms -->
    <line x1="-130" y1="-130" x2="130" y2="130" stroke="#2d3b52" stroke-width="24" stroke-linecap="round"/>
    <line x1="130" y1="-130" x2="-130" y2="130" stroke="#2d3b52" stroke-width="24" stroke-linecap="round"/>
    <!-- Rotor rings -->
    <circle cx="-130" cy="-130" r="56" fill="#0d1524" stroke="#00ffcc" stroke-width="10"/>
    <circle cx="130" cy="-130" r="56" fill="#0d1524" stroke="#00ffcc" stroke-width="10"/>
    <circle cx="-130" cy="130" r="56" fill="#0d1524" stroke="#00ffcc" stroke-width="10"/>
    <circle cx="130" cy="130" r="56" fill="#0d1524" stroke="#00ffcc" stroke-width="10"/>
    <!-- Rotor hubs -->
    <circle cx="-130" cy="-130" r="14" fill="#00ffcc"/>
    <circle cx="130" cy="-130" r="14" fill="#00ffcc"/>
    <circle cx="-130" cy="130" r="14" fill="#00ffcc"/>
    <circle cx="130" cy="130" r="14" fill="#00ffcc"/>
    <!-- Drone core hull -->
    <polygon points="0,-108 92,-28 68,88 -68,88 -92,-28" fill="url(#hullGrad)" stroke="#00ffcc" stroke-width="8"/>
    <!-- Visor & core beacon -->
    <polygon points="-44,-26 44,-26 30,10 -30,10" fill="#00ffcc"/>
    <circle cx="0" cy="46" r="16" fill="#00d4ff"/>
  </g>
</svg>
